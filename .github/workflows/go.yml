name: Go tests

on: [push]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [ 1.16, 1.17, 1.18, 1.19, '1.20', '1.21', '1.22', '1.23', '1.24', '1.25', '1.26' ]

    steps:
    - uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.version }}
      id: go

    - name: Get dependencies
      run: go mod download && go mod tidy

    - name: Vet
      run: go vet

    - name: Test
      run: go test ./...
